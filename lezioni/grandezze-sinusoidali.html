:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183047;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}header{background:#102d48;color:white;padding:24px;border-radius:18px}header small{color:#8bd5ef;letter-spacing:2px;font-weight:700}h1{margin:8px 0;font-size:clamp(26px,4vw,38px)}h2{margin:0 0 15px;font-size:21px}.lead{color:#d2e2ef;margin:0}.card{background:white;border:1px solid #dce6ef;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 5px 20px #102d4809}.formula{text-align:center;font-size:clamp(23px,4vw,34px);padding:16px;background:#edf6ff;border-radius:12px;color:#104a79}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.info{background:#f6f9fc;border-radius:12px;padding:15px;line-height:1.5}.info b{color:#1461a0}.info p{margin:7px 0 0}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;margin-top:18px}.layout .card{margin:0}.control{margin-bottom:24px}.control label{display:flex;justify-content:space-between;font-weight:700;gap:8px}.control output{color:#126ab0}.control input{width:100%;accent-color:#1682ce;margin-top:13px}.hint{font-size:12px;color:#637789}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;border-radius:10px;background:#f1f7fc}.metric span{font-size:12px;color:#526b80;display:block}.metric strong{font-size:19px;color:#0c548b}.plot{width:100%;height:auto;display:block;touch-action:pan-y}.legend{font-size:13px;color:#587085}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;background:#166fb3;color:white;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650}button.secondary{background:#e8f1f9;color:#175c8b}.note{background:#fff8e9;border-left:4px solid #e9aa37;padding:12px 16px;border-radius:7px;margin-top:15px;line-height:1.55}.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0}footer{text-align:center;color:#687d90;margin-top:25px;font-size:13px}@media(max-width:780px){.three,.layout{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:16px}}
.period-rel{margin-top:18px;padding:18px;background:#f1f8ff;border:1px solid #cce4f5;border-radius:12px;line-height:1.5}.period-rel p{margin:7px 0}.period-equations{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:15px 0}.period-equations span{background:white;border:1px solid #d1e6f7;border-radius:10px;padding:9px 18px;font-size:20px;font-weight:700;color:#125987}.period-rel .period-example{font-size:14px;color:#49647a}.period-caption{margin:7px 0 0;color:#486d88;font-size:13px}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header&gt;&lt;small&gt;TELECOMLAB · SEGNALI E SISTEMI&lt;/small&gt;&lt;h1&gt;La tensione sinusoidale&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Esplora ampiezza, pulsazione e fase iniziale modificando direttamente il segnale.&lt;/p&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;1. Espressione matematica&lt;/h2&gt;&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;v&lt;/i&gt;(&lt;i&gt;t&lt;/i&gt;) = &lt;i&gt;V&lt;/i&gt;&lt;sub&gt;p&lt;/sub&gt; sin(ω&lt;i&gt;t&lt;/i&gt; + 𐌘)&lt;/div&gt;&lt;p&gt;La tensione istantanea &lt;b&gt;v(t)&lt;/b&gt;, misurata in volt, varia nel tempo seguendo una funzione seno. L'argomento del seno è un angolo espresso in radianti.&lt;/p&gt;&lt;div class=&quot;three&quot;&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;V&lt;sub&gt;p&lt;/sub&gt; — Tensione di picco&lt;/b&gt;&lt;p&gt;Massimo valore assoluto raggiunto dalla tensione, espresso in &lt;b&gt;volt (V)&lt;/b&gt;. Determina l'altezza della sinusoide.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;ω — Pulsazione&lt;/b&gt;&lt;p&gt;Indica quanto rapidamente varia la fase, in &lt;b&gt;rad/s&lt;/b&gt;. Vale ω = 2πf = 2π/T.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;𐌘 — Fase iniziale&lt;/b&gt;&lt;p&gt;È l'argomento del seno all'istante &lt;b&gt;t = 0&lt;/b&gt;, in radianti. Determina la posizione orizzontale della sinusoide.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;period-rel&quot;&gt;&lt;div&gt;&lt;strong&gt;Frequenza e periodo: due grandezze inverse&lt;/strong&gt;&lt;p&gt;Il &lt;b&gt;periodo T&lt;/b&gt; è il tempo necessario per compiere un’oscillazione completa (in secondi). La &lt;b&gt;frequenza f&lt;/b&gt; è il numero di oscillazioni compiute in un secondo (in hertz).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;period-equations&quot;&gt;&lt;span&gt;&lt;i&gt;f&lt;/i&gt; = 1/&lt;i&gt;T&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;T&lt;/i&gt; = 1/&lt;i&gt;f&lt;/i&gt;&lt;/span&gt;&lt;span&gt;ω = 2π&lt;i&gt;f&lt;/i&gt; = 2π/&lt;i&gt;T&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;period-example&quot;&gt;Esempio: se T = 0,5 ms, allora f = 2 kHz. Se la frequenza raddoppia, il periodo si dimezza.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;layout&quot;&gt;&lt;aside class=&quot;card&quot;&gt;&lt;h2&gt;2. Modifica i parametri&lt;/h2&gt;&lt;div class=&quot;control&quot;&gt;&lt;label for=&quot;vp&quot;&gt;Tensione di picco V&lt;sub&gt;p&lt;/sub&gt;&lt;output id=&quot;vpout&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;vp&quot; max=&quot;10&quot; min=&quot;0.5&quot; step=&quot;0.5&quot; type=&quot;range&quot; value=&quot;5&quot;/&gt;&lt;div class=&quot;hint&quot;&gt;Da 0,5 V a 10 V&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;control&quot;&gt;&lt;label for=&quot;omega&quot;&gt;Pulsazione ω&lt;output id=&quot;omegaout&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;omega&quot; max=&quot;62.83185307179586&quot; min=&quot;3.141592653589793&quot; step=&quot;0.3141592653589793&quot; type=&quot;range&quot; value=&quot;6.283185307179586&quot;/&gt;&lt;div class=&quot;hint&quot;&gt;Da circa 3,14 a 62,83 krad/s (frequenze da 0,5 a 10 kHz)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;control&quot;&gt;&lt;label for=&quot;phi&quot;&gt;Fase iniziale 𐌘&lt;output id=&quot;phiout&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;phi&quot; max=&quot;180&quot; min=&quot;-180&quot; step=&quot;15&quot; type=&quot;range&quot; value=&quot;0&quot;/&gt;&lt;div class=&quot;hint&quot;&gt;Da −180° a +180° (convertita in radianti nella formula)&lt;/div&gt;&lt;/div&gt;&lt;label class=&quot;check&quot;&gt;&lt;input checked=&quot;&quot; id=&quot;reference&quot; type=&quot;checkbox&quot;/&gt; Mostra la sinusoide di riferimento (𐌘 = 0)&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;secondary&quot; id=&quot;reset&quot;&gt;Ripristina&lt;/button&gt;&lt;button id=&quot;animate&quot;&gt;▶ Anima il tempo&lt;/button&gt;&lt;/div&gt;&lt;h2 style=&quot;margin-top:26px&quot;&gt;Valori calcolati&lt;/h2&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Frequenza f&lt;/span&gt;&lt;strong id=&quot;fout&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Periodo T&lt;/span&gt;&lt;strong id=&quot;tout&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Valore efficace&lt;/span&gt;&lt;strong id=&quot;rmsout&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;3. Grafico interattivo&lt;/h2&gt;&lt;p class=&quot;legend&quot;&gt;Blu: v(t) · Grigio tratteggiato: stessa ampiezza e pulsazione, con 𐌘 = 0&lt;/p&gt;&lt;p class=&quot;period-caption&quot;&gt;La scala del tempo resta fissa (0–2,5 ms): aumentando ω, la sinusoide si restringe e mostra più oscillazioni. La freccia indica il periodo T.&lt;/p&gt;&lt;svg aria-label=&quot;Grafico della tensione sinusoidale in funzione del tempo&quot; class=&quot;plot&quot; id=&quot;chart&quot; role=&quot;img&quot; viewbox=&quot;0 0 760 455&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;formula&quot; id=&quot;liveformula&quot; style=&quot;font-size:21px;margin-top:12px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;note&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;4. Cosa osservare&lt;/h2&gt;&lt;div class=&quot;three&quot;&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;Aumenta V&lt;sub&gt;p&lt;/sub&gt;&lt;/b&gt;&lt;p&gt;I picchi si allontanano dall'asse del tempo, ma il periodo non cambia.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;Aumenta ω&lt;/b&gt;&lt;p&gt;La frequenza cresce, il periodo diminuisce: a parità di scala temporale, la sinusoide si restringe e sul grafico compaiono più oscillazioni.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;Varia 𐌘&lt;/b&gt;&lt;p&gt;Con 𐌘 positivo la curva è anticipata verso sinistra; con 𐌘 negativo è ritardata verso destra, rispetto alla sinusoide con fase nulla.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Attenzione: lo spostamento temporale rispetto alla sinusoide con fase nulla è Δt = −𐌘/ω.&lt;/p&gt;&lt;/section&gt;&lt;div style=&quot;text-align:center;margin-top:22px&quot;&gt;&lt;button onclick=&quot;parent.switchPage('ex')&quot;&gt;Vai agli esercizi →&lt;/button&gt;&lt;/div&gt;&lt;footer&gt;TelecomLab · Laboratorio didattico di Telecomunicazioni · Modulo: segnali sinusoidali&lt;/footer&gt;&lt;/main&gt;&lt;script&gt;
const $=id=&gt;document.getElementById(id), svg=$('chart'),vp=$('vp'),omega=$('omega'),phi=$('phi');
let running=false,start=0,raf=0;
const fmt=(n,d=2)=&gt;Number(n).toLocaleString('it-IT',{maximumFractionDigits:d,minimumFractionDigits:d});
function draw(markerTime=null){
  const A=+vp.value, w=+omega.value*1000, p=+phi.value*Math.PI/180;
  const f=w/(2*Math.PI), period=2*Math.PI/w, periodMs=period*1000;
  vpout.textContent=fmt(A,1)+' V';
  omegaout.textContent=fmt(w/1000,2)+' krad/s';
  phiout.textContent=`${phi.value}° (${fmt(p)} rad)`;
  fout.textContent=fmt(f/1000,2)+' kHz';
  tout.textContent=fmt(periodMs,3)+' ms';
  rmsout.textContent=fmt(A/Math.sqrt(2))+' V';


  liveformula.innerHTML=`v(t) = ${fmt(A,1)} sin(${fmt(w,0)}t ${p&lt;0?'−':'+'} ${fmt(Math.abs(p))}) V &lt;small style=&quot;display:block;font-size:13px;font-weight:normal;margin-top:5px&quot;&gt;t espresso in secondi; ω in rad/s&lt;/small&gt;`;
  explain.innerHTML=`&lt;b&gt;Interpretazione:&lt;/b&gt; il segnale oscilla fra &lt;b&gt;−${fmt(A,1)} V&lt;/b&gt; e &lt;b&gt;+${fmt(A,1)} V&lt;/b&gt;. Un ciclo dura &lt;b&gt;${fmt(periodMs,3)} ms&lt;/b&gt; e la frequenza è &lt;b&gt;${fmt(f/1000,2)} kHz&lt;/b&gt;. A t = 0 la tensione vale &lt;b&gt;${fmt(A*Math.sin(p))} V&lt;/b&gt;.`;
  const L=64,R=740,TOP=83,B=393,W=R-L,H=B-TOP,cy=(TOP+B)/2;
  // Scala temporale FISSA: la sinusoide si comprime/aumenta realmente al variare di ω.
  // Da 0 a 2,5 ms, indipendentemente da pulsazione e periodo.
  const tmaxMs=2.5,scale=H/2/11;
  let parts=[];
  const line=(x1,y1,x2,y2,stroke,width=1,dash='')=&gt;`&lt;line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${stroke}&quot; stroke-width=&quot;${width}&quot; ${dash?`stroke-dasharray=&quot;${dash}&quot;`:''}/&gt;`;
  for(let v=-10;v&lt;=10;v+=2){const y=cy-v*scale;parts.push(line(L,y,R,y,v===0?'#506b81':'#e2eaf1',v===0?1.6:1));parts.push(`&lt;text x=&quot;${L-12}&quot; y=&quot;${y+4}&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; fill=&quot;#587084&quot;&gt;${v}&lt;/text&gt;`)}
  const tickStepMs=tmaxMs/5;
  for(let i=0;i&lt;=5;i++){const t=i*tickStepMs,x=L+t/tmaxMs*W;parts.push(line(x,TOP,x,B,'#e2eaf1'));parts.push(`&lt;text x=&quot;${x}&quot; y=&quot;${B+19}&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#587084&quot;&gt;${fmt(t,3)}&lt;/text&gt;`)}
  const periodEnd=L+periodMs/tmaxMs*W,arrowY=48;
  parts.push(line(L,arrowY-9,L,TOP-3,'#1682ce',1.4,'4 4'));
  parts.push(line(periodEnd,arrowY-9,periodEnd,TOP-3,'#1682ce',1.4,'4 4'));
  parts.push(line(L,arrowY,periodEnd,arrowY,'#1476b8',2));
  parts.push(`&lt;path d=&quot;M ${L+7} ${arrowY-5} L ${L} ${arrowY} L ${L+7} ${arrowY+5} M ${periodEnd-7} ${arrowY-5} L ${periodEnd} ${arrowY} L ${periodEnd-7} ${arrowY+5}&quot; fill=&quot;none&quot; stroke=&quot;#1476b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;${(L+periodEnd)/2}&quot; y=&quot;${arrowY-12}&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;bold&quot; fill=&quot;#116ca8&quot;&gt;T = ${fmt(periodMs,3)} ms&lt;/text&gt;`);
  parts.push(`&lt;text x=&quot;${L}&quot; y=&quot;${TOP-8}&quot; font-size=&quot;13&quot; font-weight=&quot;bold&quot; fill=&quot;#35526b&quot;&gt;v(t) [V]&lt;/text&gt;&lt;text x=&quot;${R}&quot; y=&quot;${B+40}&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot; font-weight=&quot;bold&quot; fill=&quot;#35526b&quot;&gt;t [ms]&lt;/text&gt;`);
  function path(phase){let d='';for(let i=0;i&lt;=1100;i++){const tMs=tmaxMs*i/1100,x=L+W*i/1100,y=cy-A*Math.sin(w*tMs/1000+phase)*scale;d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' '}return d}
  if($('reference').checked)parts.push(`&lt;path d=&quot;${path(0)}&quot; fill=&quot;none&quot; stroke=&quot;#a2aebc&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;7 6&quot;/&gt;`);
  parts.push(`&lt;path d=&quot;${path(p)}&quot; fill=&quot;none&quot; stroke=&quot;#0878c8&quot; stroke-width=&quot;3.2&quot; stroke-linejoin=&quot;round&quot;/&gt;`);


  if(markerTime!==null){const tMs=markerTime%tmaxMs,x=L+tMs/tmaxMs*W,y=cy-A*Math.sin(w*tMs/1000+p)*scale;parts.push(line(x,TOP,x,B,'#ee9b40',1.5,'5 5'));parts.push(`&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;7&quot; fill=&quot;#f08a24&quot; stroke=&quot;white&quot; stroke-width=&quot;2&quot;/&gt;`)}
  svg.innerHTML=parts.join('');
}
[vp,omega,phi,$('reference')].forEach(e=&gt;e.addEventListener('input',()=&gt;draw()));
$('reset').onclick=()=&gt;{vp.value=5;omega.value=2*Math.PI;phi.value=0;$('reference').checked=true;running=false;cancelAnimationFrame(raf);$('animate').textContent='▶ Anima il tempo';draw()};
$('animate').onclick=()=&gt;{running=!running;$('animate').textContent=running?'⏸ Ferma animazione':'▶ Anima il tempo';if(running){start=performance.now();function frame(now){if(!running)return;draw((now-start)/2000);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}else{cancelAnimationFrame(raf);draw()}};
draw();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" title="Simulatore interattivo della tensione sinusoidale"></iframe></div>
<div aria-labelledby="btn-ex" class="hidden" id="panel-ex" role="tabpanel"><iframe id="frame-ex" loading="eager" srcdoc="&lt;!DOCTYPE html&gt;

&lt;html lang=&quot;it&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;/&gt;&lt;meta content=&quot;width=device-width,initial-scale=1&quot; name=&quot;viewport&quot;/&gt;

&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;small&gt;TELECOMLAB · SEGNALI SINUSOIDALI&lt;/small&gt;&lt;h1&gt;Esercizi guidati sulla tensione sinusoidale&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;Due esercizi complementari per imparare a leggere e a scrivere l'espressione matematica di un segnale sinusoidale. Frequenze espresse in kHz, tempi in ms.&lt;/p&gt;&lt;nav class=&quot;nav&quot;&gt;&lt;a href=&quot;#&quot; onclick=&quot;parent.switchPage('sim');return false&quot;&gt;← Torna al simulatore&lt;/a&gt;&lt;a href=&quot;#es1&quot;&gt;Esercizio 1&lt;/a&gt;&lt;a href=&quot;#es2&quot;&gt;Esercizio 2&lt;/a&gt;&lt;/nav&gt;&lt;/header&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Formulario essenziale&lt;/h2&gt;&lt;div class=&quot;formula math&quot;&gt;v(t) = V&lt;sub&gt;p&lt;/sub&gt; sin(ωt + 𐌘)&lt;/div&gt;&lt;div class=&quot;grid&quot; style=&quot;margin-top:15px&quot;&gt;&lt;div class=&quot;help&quot;&gt;&lt;b&gt;Valori caratteristici&lt;/b&gt;&lt;br/&gt;V&lt;sub&gt;eff&lt;/sub&gt; = V&lt;sub&gt;p&lt;/sub&gt; / √2&lt;br/&gt;f = ω / (2π)&lt;br/&gt;T = 1/f = 2π/ω&lt;/div&gt;&lt;div class=&quot;help&quot;&gt;&lt;b&gt;Fase e pulsazione&lt;/b&gt;&lt;br/&gt;𐌘 = fase iniziale (radianti)&lt;br/&gt;ω = 2πf (rad/s)&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;warn&quot;&gt;Attenzione alle unità: nella formula v(t) il tempo &lt;strong&gt;t è espresso in secondi&lt;/strong&gt; se ω è in rad/s. Nei grafici il tempo è visualizzato in &lt;strong&gt;millisecondi&lt;/strong&gt;: 1 ms = 0,001 s.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot; id=&quot;es1&quot;&gt;&lt;span class=&quot;pill&quot;&gt;ESERCIZIO 1 · DALL'ESPRESSIONE AI PARAMETRI&lt;/span&gt;&lt;h2&gt;Leggiamo una sinusoide&lt;/h2&gt;&lt;p class=&quot;note&quot;&gt;È assegnata la seguente tensione (t in secondi):&lt;/p&gt;&lt;div class=&quot;formula math&quot;&gt;v(t) = 8 sin(4000πt + π/6) V&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Determina: tensione di picco, tensione efficace, pulsazione, frequenza, periodo, fase iniziale.&lt;/p&gt;&lt;div class=&quot;answers&quot;&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;a1&quot;&gt;V&lt;sub&gt;p&lt;/sub&gt; (V)&lt;/label&gt;&lt;input id=&quot;a1&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;a2&quot;&gt;V&lt;sub&gt;eff&lt;/sub&gt; (V)&lt;/label&gt;&lt;input id=&quot;a2&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;a3&quot;&gt;f (kHz)&lt;/label&gt;&lt;input id=&quot;a3&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;a4&quot;&gt;T (ms)&lt;/label&gt;&lt;input id=&quot;a4&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;a5&quot;&gt;𐌘 (gradi)&lt;/label&gt;&lt;input id=&quot;a5&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;btns&quot;&gt;&lt;button onclick=&quot;checkOne()&quot; type=&quot;button&quot;&gt;Verifica le risposte&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;reveal('sol1')&quot; type=&quot;button&quot;&gt;Mostra / nascondi lo svolgimento&lt;/button&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;fb1&quot;&gt;&lt;/div&gt;&lt;div hidden=&quot;&quot; id=&quot;sol1&quot;&gt;&lt;hr class=&quot;divider&quot;/&gt;&lt;h3&gt;Svolgimento guidato&lt;/h3&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;1. Ampiezza e tensione efficace&lt;/summary&gt;&lt;p class=&quot;step&quot;&gt;Dal coefficiente davanti al seno si ricava &lt;strong&gt;V&lt;sub&gt;p&lt;/sub&gt; = 8 V&lt;/strong&gt;.&lt;br/&gt;V&lt;sub&gt;eff&lt;/sub&gt; = 8/√2 ≈ &lt;strong&gt;5,66 V&lt;/strong&gt;.&lt;/p&gt;&lt;/details&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;2. Pulsazione, frequenza e periodo&lt;/summary&gt;&lt;p class=&quot;step&quot;&gt;Confrontando con ωt: &lt;strong&gt;ω = 4000π rad/s ≈ 12 566,37 rad/s&lt;/strong&gt;.&lt;br/&gt;f = 4000π/(2π) = 2000 Hz = &lt;strong&gt;2 kHz&lt;/strong&gt;.&lt;br/&gt;T = 1/2000 s = 0,0005 s = &lt;strong&gt;0,5 ms&lt;/strong&gt;.&lt;/p&gt;&lt;/details&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;3. Fase iniziale&lt;/summary&gt;&lt;p class=&quot;step&quot;&gt;&lt;strong&gt;𐌘 = π/6 rad = +30°&lt;/strong&gt;. La fase positiva corrisponde a un anticipo rispetto a 8 sin(4000πt).&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;hr class=&quot;divider&quot;/&gt;&lt;h3&gt;Grafico dell'esercizio 1&lt;/h3&gt;&lt;canvas aria-label=&quot;Tensione sinusoidale esercizio 1 con periodo di 0,5 millisecondi&quot; class=&quot;plot&quot; height=&quot;330&quot; id=&quot;g1&quot; role=&quot;img&quot; width=&quot;960&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;caption&quot;&gt;La linea tratteggiata rappresenta la sinusoide con fase iniziale nulla. La doppia freccia indica un periodo T = 0,5 ms.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot; id=&quot;es2&quot;&gt;&lt;span class=&quot;pill&quot;&gt;ESERCIZIO 2 · DAI PARAMETRI ALL'ESPRESSIONE&lt;/span&gt;&lt;h2&gt;Costruiamo una sinusoide&lt;/h2&gt;&lt;p class=&quot;note&quot;&gt;Una tensione sinusoidale ha i seguenti dati:&lt;/p&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Tensione efficace&lt;/small&gt;&lt;strong&gt;V&lt;sub&gt;eff&lt;/sub&gt; = 7,07 V&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Frequenza&lt;/small&gt;&lt;strong&gt;f = 5 kHz&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Fase iniziale&lt;/small&gt;&lt;strong&gt;𐌘 = −π/4 rad&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Valore medio su un periodo&lt;/small&gt;&lt;strong&gt;0 V&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Determina la &lt;strong&gt;tensione di picco&lt;/strong&gt;, la &lt;strong&gt;pulsazione&lt;/strong&gt;, il &lt;strong&gt;periodo&lt;/strong&gt; e scrivi l'espressione completa di &lt;span class=&quot;math&quot;&gt;v(t)&lt;/span&gt;.&lt;/p&gt;&lt;div class=&quot;answers&quot;&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;b1&quot;&gt;V&lt;sub&gt;p&lt;/sub&gt; (V, approssimato)&lt;/label&gt;&lt;input id=&quot;b1&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;b2&quot;&gt;ω (rad/s oppure coefficiente di π)&lt;/label&gt;&lt;input id=&quot;b2&quot; inputmode=&quot;decimal&quot; type=&quot;text&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;answer&quot;&gt;&lt;label for=&quot;b3&quot;&gt;T (ms)&lt;/label&gt;&lt;input id=&quot;b3&quot; step=&quot;any&quot; type=&quot;number&quot;/&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;btns&quot;&gt;&lt;button onclick=&quot;checkTwo()&quot; type=&quot;button&quot;&gt;Verifica le risposte&lt;/button&gt;&lt;button class=&quot;secondary&quot; onclick=&quot;reveal('sol2')&quot; type=&quot;button&quot;&gt;Mostra / nascondi lo svolgimento&lt;/button&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;feedback&quot; id=&quot;fb2&quot;&gt;&lt;/div&gt;&lt;div hidden=&quot;&quot; id=&quot;sol2&quot;&gt;&lt;hr class=&quot;divider&quot;/&gt;&lt;h3&gt;Svolgimento guidato&lt;/h3&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;1. Ricava il valore di picco&lt;/summary&gt;&lt;p class=&quot;step&quot;&gt;V&lt;sub&gt;p&lt;/sub&gt; = V&lt;sub&gt;eff&lt;/sub&gt; √2 = 7,07√2 ≈ &lt;strong&gt;10,00 V&lt;/strong&gt;. La tensione efficace è arrotondata, quindi anche 10 V è un valore approssimato.&lt;/p&gt;&lt;/details&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;2. Ricava pulsazione e periodo&lt;/summary&gt;&lt;p class=&quot;step&quot;&gt;f = 5 kHz = 5000 Hz.&lt;br/&gt;ω = 2π · 5000 = &lt;strong&gt;10000π rad/s ≈ 31 415,93 rad/s&lt;/strong&gt;.&lt;br/&gt;T = 1/5000 s = &lt;strong&gt;0,2 ms&lt;/strong&gt;.&lt;/p&gt;&lt;/details&gt;&lt;details open=&quot;&quot;&gt;&lt;summary&gt;3. Scrivi l’espressione&lt;/summary&gt;&lt;div class=&quot;formula math&quot;&gt;v(t) ≈ 10 sin(10000πt − π/4) V&lt;/div&gt;&lt;p class=&quot;step&quot;&gt;La fase negativa corrisponde a un ritardo rispetto a 10 sin(10000πt).&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;hr class=&quot;divider&quot;/&gt;&lt;h3&gt;Grafico dell'esercizio 2&lt;/h3&gt;&lt;canvas aria-label=&quot;Tensione sinusoidale esercizio 2 con periodo di 0,2 millisecondi&quot; class=&quot;plot&quot; height=&quot;330&quot; id=&quot;g2&quot; role=&quot;img&quot; width=&quot;960&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;caption&quot;&gt;La sinusoide è in ritardo rispetto alla riferimento tratteggiata. La doppia freccia mostra T = 0,2 ms.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Che cosa abbiamo imparato?&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;help&quot;&gt;&lt;b&gt;Se conosci l’espressione&lt;/b&gt;&lt;br/&gt;Leggi V&lt;sub&gt;p&lt;/sub&gt;, ω e 𐌘, poi calcola f, T e V&lt;sub&gt;eff&lt;/sub&gt;.&lt;/div&gt;&lt;div class=&quot;help&quot;&gt;&lt;b&gt;Se conosci i dati&lt;/b&gt;&lt;br/&gt;Calcola V&lt;sub&gt;p&lt;/sub&gt; = V&lt;sub&gt;eff&lt;/sub&gt;√2 e ω = 2πf, quindi componi v(t) = V&lt;sub&gt;p&lt;/sub&gt; sin(ωt + 𐌘).&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Nei due esercizi l'asse del tempo è in ms, mentre nell'espressione matematica si usa t in secondi. La fase è espressa in radianti all'interno della funzione seno.&lt;/p&gt;&lt;/section&gt;&lt;footer&gt;TelecomLab · Telecomunicazioni · Classe quarta · Esercizi dimostrativi&lt;/footer&gt;
&lt;/div&gt;&lt;script&gt;
function reveal(id){const x=document.getElementById(id);x.hidden=!x.hidden}
function verify(prefix, expected, tol, fb){let ok=0, filled=0;for(let i=0;i&lt;expected.length;i++){const el=document.getElementById(prefix+(i+1));const s=el.value.trim();let match=false;if(s!==''){filled++;match=Math.abs(Number(s)-expected[i])&lt;=tol[i]}el.style.borderColor=s===''?'#b7cad8':match?'#16834c':'#bd563b';if(match)ok++}const target=document.getElementById(fb);target.textContent=filled===0?'Inserisci almeno una risposta.':ok===expected.length?'Corretto! Tutti i risultati sono giusti.':`${ok} risposte corrette su ${expected.length}. Controlla i campi evidenziati; puoi consultare lo svolgimento.`;target.className='feedback '+(ok===expected.length?'ok':'bad')}
function checkOne(){verify('a',[8,8/Math.sqrt(2),2,.5,30],[.01,.03,.001,.001,.01],'fb1')}
function parseOmega(s){
  const raw=s.trim().toLowerCase().replace(/\s/g,'').replace(/,/g,'.').replace(/π/g,'pi').replace(/×/g,'*').replace(/−/g,'-');
  if(!raw)return NaN;
  // Numeri in rad/s; un coefficiente puro di pi; prodotti semplici con pi.
  const plain=Number(raw);
  if(Number.isFinite(plain))return plain;
  const match=raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\*?pi$/);
  if(match)return Number(match[1])*Math.PI;
  if(raw==='pi'||raw==='+pi')return Math.PI;
  if(raw==='-pi')return -Math.PI;
  return NaN;
}
function checkTwo(){
  // Vp e T usano la verifica standard, mentre omega accetta sia rad/s sia il coefficiente di pi.
  const b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  const entries=[b1,b2,b3], filled=entries.filter(el=&gt;el.value.trim()!=='').length;
  const omegaInput=b2.value.trim();
  const parsed=parseOmega(omegaInput);
  const omegaMatch=omegaInput!=='' &amp;&amp; Number.isFinite(parsed) &amp;&amp; (
    Math.abs(parsed-10000*Math.PI)&lt;=1 || // es. 31415,93 rad/s o 10000pi
    (!/pi|π/i.test(omegaInput) &amp;&amp; Math.abs(parsed-10000)&lt;=0.01) // coefficiente di pi
  );
  const matches=[b1.value.trim()!=='' &amp;&amp; Math.abs(Number(b1.value)-7.07*Math.sqrt(2))&lt;=.07,
                 omegaMatch,
                 b3.value.trim()!=='' &amp;&amp; Math.abs(Number(b3.value)-.2)&lt;=.001];
  entries.forEach((el,i)=&gt;{el.style.borderColor=el.value.trim()===''?'#b7cad8':matches[i]?'#16834c':'#bd563b'});
  const ok=matches.filter(Boolean).length,target=document.getElementById('fb2');
  target.textContent=filled===0?'Inserisci almeno una risposta.':ok===3?'Corretto! Tutti i risultati sono giusti.':`${ok} risposte corrette su 3. Controlla i campi evidenziati; puoi consultare lo svolgimento.`;
  target.className='feedback '+(ok===3?'ok':'bad');
}
function draw(id,vp,fk,phase){const can=document.getElementById(id),ctx=can.getContext('2d');const W=can.width,H=can.height;ctx.clearRect(0,0,W,H);const L=75,R=22,top=30,bottom=65,pw=W-L-R,mid=(H-bottom+top)/2,amp=(H-bottom-top)*.37;const T=1/fk;const span=T*2.5;const X=t=&gt;L+pw*t/span;const Y=v=&gt;mid-amp*v/vp;ctx.font='15px system-ui';ctx.strokeStyle='#e4ebf1';ctx.lineWidth=1;for(let i=0;i&lt;=5;i++){const x=L+pw*i/5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,H-bottom);ctx.stroke()}for(let i=-1;i&lt;=1;i++){const y=Y(i*vp);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke()}ctx.strokeStyle='#758da1';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(L,top);ctx.lineTo(L,H-bottom);ctx.moveTo(L,mid);ctx.lineTo(W-R,mid);ctx.stroke();ctx.fillStyle='#48657a';ctx.textAlign='right';for(let k=-1;k&lt;=1;k++)ctx.fillText(String(k*vp).replace('.',','),L-12,Y(k*vp)+5);ctx.fillText('V',L-43,top-5);ctx.textAlign='center';for(let i=0;i&lt;=5;i++){const t=span*i/5;ctx.fillText(t.toLocaleString('it-IT',{maximumFractionDigits:3}),X(t),H-bottom+23)}ctx.fillText('t (ms)',W-53,H-15);
const curve=(ph,color,dash,width)=&gt;{ctx.strokeStyle=color;ctx.setLineDash(dash);ctx.lineWidth=width;ctx.beginPath();for(let i=0;i&lt;=800;i++){const t=span*i/800;const y=Y(vp*Math.sin(2*Math.PI*fk*t+ph));if(i===0)ctx.moveTo(X(t),y);else ctx.lineTo(X(t),y)}ctx.stroke();ctx.setLineDash([])};curve(0,'#9aaaba',[7,7],2);curve(phase,'#1685c3',[],3);
const ay=H-bottom+43,x1=X(.23*T),x2=X(1.23*T);ctx.strokeStyle='#0d5c91';ctx.fillStyle='#0d5c91';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,ay);ctx.lineTo(x2,ay);ctx.stroke();for(const [x,sign] of [[x1,1],[x2,-1]]){ctx.beginPath();ctx.moveTo(x,ay);ctx.lineTo(x+sign*9,ay-5);ctx.lineTo(x+sign*9,ay+5);ctx.closePath();ctx.fill()}ctx.font='bold 15px system-ui';ctx.fillText('T = '+T.toLocaleString('it-IT',{maximumFractionDigits:3})+' ms',(x1+x2)/2,ay-8);
ctx.fillStyle='#1685c3';ctx.textAlign='left';ctx.fillText('— Segnale',L+12,top-8);ctx.fillStyle='#8496a6';ctx.fillText('┄ Riferimento (𐌘 = 0)',L+150,top-8)}
draw('g1',8,2,Math.PI/6);draw('g2',7.07*Math.sqrt(2),5,-Math.PI/4);
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;

function switchPage(page){for(const key of ['sim','ex']){const selected=key===page;document.getElementById('panel-'+key).classList.toggle('hidden',!selected);const button=document.getElementById('btn-'+key);button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected))}requestAnimationFrame(()=>{fit(document.getElementById('frame-'+page));window.scrollTo({top:0,behavior:'smooth'})})}
for(const key of ['sim','ex']){const frame=document.getElementById('frame-'+key);frame.addEventListener('load',()=>{fit(frame);try{new ResizeObserver(()=>fit(frame)).observe(frame.contentDocument.body)}catch(e){}})}
